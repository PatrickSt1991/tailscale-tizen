name: Spike — tizen50 .tpk with in-process c-shared

# Step C of the spike. Step B's softfp/glibc-2.24 build got past the loader's
# ELF/ABI check on the RU7020 (the old "internal error" is gone) but dlopen now
# fails with "failed to map segment from shared object" — an mmap() inside the
# dynamic loader was refused, and glibc 2.24 drops the errno. This build adds:
#   - SpikeProbe.cs: reproduces the loader's mmaps by hand with errno, dumps
#     mount options / Smack labels / limits / address-space holes to :8081
#   - two tiny control libs (C, Go) built with the same toolchain
#   - the .so files in lib/ (Tizen's native-lib dir) as well as shared/res
#   - a symbol-size report of the engine image (why is .noptrbss 34MB?)
# Install on the retail 5.0 TV, read :8081, and the PROBE/dlopen lines say
# whether it is policy (noexec/Smack), memory, or the Go image layout.

on:
  workflow_dispatch:
  push:
    branches: [tizen5-cshared-spike]
    paths:
      - 'cshared/**'
      - 'Tailscale5/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/spike-tpk-tizen5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # SOFT-FLOAT cross toolchain (Tizen 5.0 armv7 is softfp, NOT -gnueabihf).
      - name: Install soft-float ARM cross toolchain + rpm tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi rpm2cpio cpio

      # Extract a Tizen 5.0 armv7 sysroot (glibc 2.24) so the .so links against
      # the TV's glibc/ABI. NVRs shift per snapshot, so grep them from the live
      # dir listing rather than hardcoding.
      - name: Fetch + unpack Tizen 5.0 armv7 sysroot (glibc 2.24, softfp)
        run: |
          BASE=https://download.tizen.org/snapshots/TIZEN/Tizen-5.0/Tizen-5.0-Base/latest/repos/standard/packages/armv7l
          mkdir -p "$GITHUB_WORKSPACE/sysroot" && cd "$GITHUB_WORKSPACE/sysroot"
          listing=$(curl -fsSL "$BASE/")
          pick() { echo "$listing" | grep -oE "$1[^\"]*\.armv7l\.rpm" | sort -uV | tail -1; }
          for pat in 'glibc-2\.24-' 'glibc-devel-2\.24-' 'libgcc-[0-9]' 'linux-glibc-devel-'; do
            f=$(pick "$pat"); [ -z "$f" ] && { echo "skip (no match): $pat"; continue; }
            echo "fetch $f"; curl -fsSL "$BASE/$f" -o pkg.rpm && rpm2cpio pkg.rpm | cpio -idm --quiet && rm pkg.rpm
          done
          echo "=== sysroot key files ==="; ls -la lib usr/lib 2>/dev/null | grep -E 'libc\.so|libpthread|libdl|crt1\.o|crti\.o' | head

      - name: Build engine + control libs (armv7, softfp, Tizen 5.0 sysroot)
        run: |
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          FLAGS="-march=armv7-a -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp"
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7
          export CC="arm-linux-gnueabi-gcc --sysroot=$SYSROOT $FLAGS"
          export CGO_CFLAGS="$FLAGS -O2"
          export CGO_LDFLAGS="--sysroot=$SYSROOT -fuse-ld=bfd -L$SYSROOT/lib -L$SYSROOT/usr/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/usr/lib"

          echo "=== engine, unstripped (for the symbol-size report only) ==="
          make cshared CSHARED_LDFLAGS= CSHARED_OUT=cshared/libtsspike-dbg.so
          echo "--- top 15 symbols by size ---"
          go tool nm -size -sort size cshared/libtsspike-dbg.so | head -15 || true
          echo "--- top 10 .bss/.noptrbss symbols (why is the RW segment 36MB?) ---"
          go tool nm -size -sort size cshared/libtsspike-dbg.so | awk '$3=="B"||$3=="b"' | head -10 || true
          rm -f cshared/libtsspike-dbg.so cshared/libtsspike-dbg.h

          echo "=== engine, stripped (ships) ==="
          make cshared
          echo "=== Go control lib ==="
          make cshared-hello
          echo "=== C control lib ==="
          $CC -shared -fPIC -O2 -o cshared/libhello_c.so cshared/cprobe/hello_c.c
          ls -la cshared/*.so

      - name: Verify .so ABI (soft-float + glibc <= 2.24) for all three
        run: |
          for so in cshared/libtsspike.so cshared/libhello_go.so cshared/libhello_c.so; do
            echo "=== $so ==="
            arm-linux-gnueabi-readelf -h "$so" | grep -iE 'Class|OS/ABI|Machine|Flags'
            if arm-linux-gnueabi-readelf -A "$so" | grep -qi 'VFP_args'; then echo "FAIL: hard-float object: $so"; exit 1; else echo "OK: soft-float"; fi
            MAX=$(arm-linux-gnueabi-objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1); echo "max glibc=${MAX:-none}"
            if [ -n "$MAX" ] && [ "$(printf '%s\n' GLIBC_2.24 "$MAX" | sort -V | tail -1)" != "GLIBC_2.24" ]; then echo "FAIL: needs $MAX > 2.24"; exit 1; fi
            echo "--- program headers ---"; arm-linux-gnueabi-readelf -lW "$so" | grep -E 'LOAD|TLS|GNU_STACK'
          done

      # Into shared/res AND lib/ BEFORE dotnet build (classic SDK globs at eval
      # time). Program.cs tries lib/ first, then shared/res, then a data copy.
      - name: Stage .so files into shared/res and lib/
        run: |
          mkdir -p Tailscale5/lib
          for so in libtsspike.so libhello_go.so libhello_c.so; do
            cp "cshared/$so" "Tailscale5/shared/res/$so"
            cp "cshared/$so" "Tailscale5/lib/$so"
          done
          ls -la Tailscale5/shared/res Tailscale5/lib

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Build tizen50 .tpk
        run: dotnet build Tailscale5/Tailscale5.csproj -c Debug

      - name: Locate + verify .tpk contents
        run: |
          f=$(find Tailscale5/bin -name '*.tpk' | head -n 1)
          if [ -z "$f" ]; then echo "No .tpk produced" >&2; exit 1; fi
          cp "$f" Tailscale-tizen5-spike.tpk
          echo "Built: $f"
          echo "--- native libs in the package ---"
          unzip -l "$f" | grep -E '\.so$' || true
          for so in libtsspike.so libhello_go.so libhello_c.so; do
            unzip -l "$f" | grep -q "shared/res/$so" || { echo "FAIL: $so NOT in shared/res/" >&2; exit 1; }
          done
          echo "OK: all three .so files in shared/res/"
          if unzip -l "$f" | grep -q 'lib/libtsspike.so'; then
            echo "OK: lib/ packaged too (the app will try that location first)"
          else
            echo "NOTE: SDK did not package lib/ — the app will report 'nothing here' for lib/ and fall through"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tailscale-tizen5-spike
          path: Tailscale-tizen5-spike.tpk
