name: Spike — tizen50 .tpk with in-process c-shared

# Step B of the spike: bundle the CGO c-shared Tailscale engine into the
# tizen50 .tpk (in bin/, so DllImport resolves it) and let the app P/Invoke it.
# Install on the retail 5.0 TV and read :8081 — if the Go runtime comes alive
# and tsnet logs its auth URL, dlopen + in-process tailscale works under the
# retail sandbox (the whole point).

on:
  workflow_dispatch:
  push:
    branches: [tizen5-cshared-spike]
    paths:
      - 'cshared/**'
      - 'Tailscale5/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/spike-tpk-tizen5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # SOFT-FLOAT cross toolchain (Tizen 5.0 armv7 is softfp, NOT -gnueabihf).
      - name: Install soft-float ARM cross toolchain + rpm tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi rpm2cpio cpio

      # Extract a Tizen 5.0 armv7 sysroot (glibc 2.24) so the .so links against
      # the TV's glibc/ABI. NVRs shift per snapshot, so grep them from the live
      # dir listing rather than hardcoding.
      - name: Fetch + unpack Tizen 5.0 armv7 sysroot (glibc 2.24, softfp)
        run: |
          BASE=https://download.tizen.org/snapshots/TIZEN/Tizen-5.0/Tizen-5.0-Base/latest/repos/standard/packages/armv7l
          mkdir -p "$GITHUB_WORKSPACE/sysroot" && cd "$GITHUB_WORKSPACE/sysroot"
          listing=$(curl -fsSL "$BASE/")
          pick() { echo "$listing" | grep -oE "$1[^\"]*\.armv7l\.rpm" | sort -uV | tail -1; }
          for pat in 'glibc-2\.24-' 'glibc-devel-2\.24-' 'libgcc-[0-9]' 'linux-glibc-devel-'; do
            f=$(pick "$pat"); [ -z "$f" ] && { echo "skip (no match): $pat"; continue; }
            echo "fetch $f"; curl -fsSL "$BASE/$f" -o pkg.rpm && rpm2cpio pkg.rpm | cpio -idm --quiet && rm pkg.rpm
          done
          echo "=== sysroot key files ==="; ls -la lib usr/lib 2>/dev/null | grep -E 'libc\.so|libpthread|libdl|crt1\.o|crti\.o' | head

      - name: Build c-shared engine (armv7, softfp, Tizen 5.0 sysroot)
        run: |
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          FLAGS="-march=armv7-a -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp"
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7
          export CC="arm-linux-gnueabi-gcc --sysroot=$SYSROOT $FLAGS"
          export CGO_CFLAGS="$FLAGS -O2"
          export CGO_LDFLAGS="--sysroot=$SYSROOT -fuse-ld=bfd -L$SYSROOT/lib -L$SYSROOT/usr/lib -Wl,-rpath-link,$SYSROOT/lib -Wl,-rpath-link,$SYSROOT/usr/lib"
          make cshared

      - name: Verify .so ABI (soft-float + glibc <= 2.24)
        run: |
          echo "--- header ---"; arm-linux-gnueabi-readelf -h cshared/libtsspike.so | grep -iE 'Class|OS/ABI|Machine'
          echo "--- float ABI (Tag_ABI_VFP_args must be ABSENT for softfp) ---"
          if arm-linux-gnueabi-readelf -A cshared/libtsspike.so | grep -qi 'VFP_args'; then echo "FAIL: hard-float object present"; exit 1; else echo "OK: soft-float"; fi
          echo "--- max GLIBC symbol version ---"
          MAX=$(arm-linux-gnueabi-objdump -T cshared/libtsspike.so | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1); echo "max=${MAX:-none}"
          if [ -n "$MAX" ] && [ "$(printf '%s\n' GLIBC_2.24 "$MAX" | sort -V | tail -1)" != "GLIBC_2.24" ]; then echo "FAIL: needs $MAX > 2.24"; exit 1; fi
          echo "OK: glibc ceiling within 2.24"

      # Into shared/res BEFORE dotnet build (classic SDK globs shared/res at
      # eval time). Program.cs dlopen()s it by absolute path from there.
      - name: Stage libtsspike.so into shared/res
        run: cp cshared/libtsspike.so Tailscale5/shared/res/libtsspike.so

      - name: Setup .NET Core 3.1 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Build tizen50 .tpk
        run: dotnet build Tailscale5/Tailscale5.csproj -c Debug

      - name: Locate + verify .tpk contains shared/res/libtsspike.so
        run: |
          f=$(find Tailscale5/bin -name '*.tpk' | head -n 1)
          if [ -z "$f" ]; then echo "No .tpk produced" >&2; exit 1; fi
          cp "$f" Tailscale-tizen5-spike.tpk
          echo "Built: $f"
          if unzip -l "$f" | grep -q 'shared/res/libtsspike.so'; then
            echo "OK: libtsspike.so is packaged in shared/res/"
          else
            echo "FAIL: libtsspike.so NOT in shared/res/" >&2
            unzip -l "$f" | grep -iE 'libtsspike|\.so' || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tailscale-tizen5-spike
          path: Tailscale-tizen5-spike.tpk
