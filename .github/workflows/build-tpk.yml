name: Build Tizen .tpk

on:
  workflow_dispatch:
    inputs:
      goarch:
        description: "tailscaled target arch (arm64 = Tizen 8 TVs, arm = 32-bit ARM TVs, amd64/386 = x86 TV emulator)"
        type: choice
        options: [arm64, arm, amd64, "386"]
        default: arm64
  push:
    branches: [main]
    paths:
      - 'Tailscale/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Makefile defaults to DOTNET ?= $HOME/.dotnet-local/dotnet, so install
      # .NET 6 (net6.0-tizen8.0 per the csproj) exactly there.
      - name: Install .NET 6 SDK to ~/.dotnet-local
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 6.0 --install-dir "$HOME/.dotnet-local"
          echo "$HOME/.dotnet-local" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet-local" >> "$GITHUB_ENV"

      - name: Install Tizen .NET workload
        run: curl -sSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh | bash

      - name: Build unsigned .tpk (make tailscaled + dotnet build)
        run: make build GOARCH=${{ github.event.inputs.goarch || 'arm64' }}

      - name: Locate .tpk
        id: tpk
        run: |
          f=$(find Tailscale/bin -name '*.tpk' | head -n 1)
          if [ -z "$f" ]; then echo "No .tpk produced" >&2; exit 1; fi
          cp "$f" Tailscale.tpk
          echo "Built: $f"

      - name: Compute release tag
        id: tag
        run: |
          arch="${{ github.event.inputs.goarch || 'arm64' }}"
          sha=$(git rev-parse --short HEAD)
          if [ "$arch" = "arm64" ]; then
            # Default Tizen 8 (aarch64) build: canonical tag, marked latest.
            echo "tag=tpk-$sha"                          >> "$GITHUB_OUTPUT"
            echo "name=Tizen .tpk (tpk-$sha)"             >> "$GITHUB_OUTPUT"
            echo "latest=true"                            >> "$GITHUB_OUTPUT"
            echo "arch=arm64 (aarch64, Tizen 8 TVs)"      >> "$GITHUB_OUTPUT"
          else
            # Non-default arch: suffixed tag, never latest.
            echo "tag=tpk-$arch-$sha"                     >> "$GITHUB_OUTPUT"
            echo "name=Tizen .tpk — $arch (tpk-$arch-$sha)" >> "$GITHUB_OUTPUT"
            echo "latest=false"                           >> "$GITHUB_OUTPUT"
            case "$arch" in
              amd64|386) echo "arch=$arch (x86 TV emulator only)" >> "$GITHUB_OUTPUT" ;;
              arm)       echo "arch=arm/v7 (32-bit ARM TVs)"      >> "$GITHUB_OUTPUT" ;;
              *)         echo "arch=$arch"                        >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          make_latest: ${{ steps.tag.outputs.latest }}
          files: Tailscale.tpk
          body: |
            Unsigned Tizen `.tpk` built from `tailscale/tailscale-tizen`.
            tailscaled target arch: **${{ steps.tag.outputs.arch }}**.
            Install via a DUID-bound developer certificate (e.g. Apps2Samsung), or sign
            with the default Tizen certificate for the emulator.
