name: Spike — build c-shared tailscale .so

# Step A of the in-process-.so spike: prove tailscale (via tsnet) compiles as a
# CGO -buildmode=c-shared library for linux/arm (armv7) at the pinned version.
# Build-only — no device involved. If this is red, the in-process approach is a
# dead end and we learn it without a TV install cycle.

on:
  workflow_dispatch:
  push:
    branches: [tizen5-cshared-spike]
    paths:
      - 'cshared/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/spike-cshared.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install armv7 cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build c-shared .so (armv7, CGO)
        run: make cshared

      - name: Inspect the .so
        run: |
          file cshared/libtsspike.so
          ls -la cshared/libtsspike.so cshared/libtsspike.h

      - uses: actions/upload-artifact@v4
        with:
          name: libtsspike-arm
          path: |
            cshared/libtsspike.so
            cshared/libtsspike.h
